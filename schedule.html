<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>セミナースケジュール｜櫻桃ビジネススクール サテライトキャンパス新潟校</title>
<meta name="description" content="次回セミナーの日時・内容と、今後の開催予定をご案内します。">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@300;400;500;700;800&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap');

  :root{
    --teal-900:#0b4a43;
    --teal-800:#0e6e63;
    --teal-700:#159c8c;
    --teal-600:#22b6a1;
    --teal-500:#3fd0bb;
    --teal-400:#7fe6d2;
    --teal-300:#b8f2e2;
    --aqua-100:#eef3e0;
    --aqua-050:#faf4e0;
    --gold-500:#f2a93c;
    --gold-300:#ffe9b8;
    --sakura-300:#f4e2b8;
    --sakura-400:#e2b463;
    --ink:#0d332e;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    --heading: "Zen Kaku Gothic New", "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--sans); color:var(--ink);
    background:
      radial-gradient(circle at 1px 1px, rgba(4,82,74,.07) 1px, transparent 0) 0 0/24px 24px,
      var(--aqua-050);
    line-height:1.8; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:640px; margin:0 auto; padding:0 20px 60px;}
  .icon{width:1em; height:1em; vertical-align:-.14em; margin-right:.4em; flex-shrink:0;}

  header{
    position:relative; overflow:hidden;
    background:linear-gradient(180deg, #0a4f47 0%, #159c8c 50%, #3fd0bb 100%);
    padding:44px 20px 46px; text-align:center; color:#fff;
  }
  header::before{
    content:""; position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(circle at 50% -15%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(circle at 82% 10%, rgba(255,255,255,.22), transparent 50%),
      radial-gradient(circle at 12% 92%, rgba(255,233,184,.2), transparent 45%),
      radial-gradient(ellipse 70% 55% at 50% 42%, rgba(4,42,38,.28), transparent 70%);
  }
  header::after{
    content:""; position:absolute; inset:-20% -10%; z-index:0; opacity:.55; pointer-events:none;
    background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,.12) 50%, transparent 58%);
    animation:shimmer-move 9s ease-in-out infinite;
  }
  @keyframes shimmer-move{
    0%,100%{transform:translateX(-8%);}
    50%{transform:translateX(8%);}
  }
  @media (prefers-reduced-motion: reduce){
    header::after{animation:none;}
  }
  header h1{position:relative; z-index:2;}
  .corner-logo{
    position:absolute; top:16px; left:20px; z-index:2; text-align:left;
    font-family:var(--serif); font-size:.62rem; letter-spacing:.08em; font-weight:700;
    color:rgba(255,255,255,.55); line-height:1.5;
  }
  .corner-logo span{display:block; font-size:.52rem; letter-spacing:.1em; color:rgba(184,242,226,.55); font-weight:700;}
  header h1{display:inline-grid; justify-items:stretch;}
  header h1 .konkai{
    display:block; font-family:var(--serif); font-weight:800; letter-spacing:.06em;
    font-size:clamp(2.1rem, 10vw, 2.7rem); color:#fff; white-space:nowrap;
    text-shadow:0 2px 4px rgba(2,30,26,.4), 0 2px 18px rgba(255,233,184,.4);
  }
  header h1 .page-sub{
    display:block; font-family:var(--heading); font-weight:700; font-size:.92rem;
    color:var(--teal-300); margin-top:10px;
    text-align:justify; text-align-last:justify; text-justify:inter-character;
  }
  .ocean-waves{position:relative; z-index:2; height:56px; overflow:hidden; margin-top:-2px;}
  .ocean-waves .wave{position:absolute; top:0; left:0; width:200%; height:100%; display:block;}
  .ocean-waves .wave-a{fill:rgba(184,242,226,.32); animation:wave-drift 18s linear infinite;}
  .ocean-waves .wave-b{fill:rgba(21,156,140,.45); animation:wave-drift 12s linear infinite reverse;}
  .ocean-waves .wave-c{fill:#faf4e0; animation:wave-drift 8.5s linear infinite;}
  @keyframes wave-drift{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  @media (prefers-reduced-motion: reduce){
    .ocean-waves .wave{animation:none;}
  }

  .section-label{
    font-family:var(--serif); letter-spacing:.2em; font-size:.72rem;
    color:var(--teal-600); text-transform:uppercase; font-weight:700;
    margin:34px 0 14px; display:flex; align-items:center; gap:.6em;
  }
  .section-label::before{content:""; width:22px; height:3px; border-radius:2px; background:var(--gold-500);}

  .next-card{
    background:#fff; border-radius:20px;
    box-shadow:0 16px 40px rgba(4,58,52,.16);
    padding:26px 22px; position:relative; overflow:hidden;
    border:1px solid rgba(4,82,74,.06);
  }
  .next-card::before{
    content:"NEXT"; position:absolute; top:14px; right:-32px;
    background:var(--gold-500); color:#fff; font-family:var(--heading); font-weight:900;
    font-size:.7rem; letter-spacing:.1em; padding:5px 40px; transform:rotate(38deg);
    box-shadow:0 4px 10px rgba(4,58,52,.2);
  }
  .next-card::after{
    content:""; position:absolute; left:-30px; bottom:-30px; width:110px; height:110px;
    border-radius:50%; background:radial-gradient(circle, var(--sakura-300), transparent 70%);
    opacity:.5; pointer-events:none;
  }
  .next-date{font-family:var(--serif); font-weight:800; font-size:1.9rem; color:var(--teal-800); line-height:1.2;}
  .next-date .yw{font-size:1rem; font-weight:700; color:var(--teal-600); display:block; margin-bottom:2px;}
  .next-time{
    display:inline-flex; align-items:center; margin-top:12px; padding:6px 16px; border-radius:999px;
    background:var(--aqua-100); color:var(--teal-700); font-weight:800; font-size:.92rem;
  }
  .next-title{
    font-family:var(--heading); font-weight:900; font-size:1.15rem; color:var(--teal-900);
    margin-top:16px; position:relative;
  }
  .next-desc{display:flex; align-items:center; margin-top:10px; font-size:.92rem; color:var(--ink); opacity:.85; position:relative;}

  .empty-note{
    background:#fff; border-radius:20px;
    box-shadow:0 16px 40px rgba(4,58,52,.12); padding:26px 22px;
    font-size:.92rem; color:var(--teal-700); text-align:center;
  }

  .upcoming-list{position:relative; display:flex; flex-direction:column; gap:16px; padding-left:26px;}
  .upcoming-list::before{
    content:""; position:absolute; left:7px; top:8px; bottom:8px; width:2px;
    background:linear-gradient(180deg, var(--teal-400), var(--sakura-300) 85%, transparent);
    border-radius:2px;
  }
  .upcoming-item{
    position:relative; display:flex; gap:14px; align-items:center; background:#fff;
    border-radius:14px; padding:13px 16px; box-shadow:0 6px 18px rgba(4,58,52,.08);
    border:1px solid rgba(4,82,74,.05);
  }
  .upcoming-item::before{
    content:""; position:absolute; left:-25px; top:50%; transform:translateY(-50%);
    width:11px; height:11px; border-radius:50%; background:var(--teal-500);
    box-shadow:0 0 0 4px var(--aqua-050);
  }
  .upcoming-item .d{
    font-family:var(--serif); font-weight:800; color:var(--teal-800);
    font-size:.92rem; text-align:center; line-height:1.2;
    background:var(--aqua-100); border-radius:10px; padding:8px 10px; min-width:50px;
  }
  .upcoming-item .d span{display:block; font-size:.6rem; color:var(--teal-500); font-weight:700; margin-top:2px;}
  .upcoming-item .body{flex:1; min-width:0;}
  .upcoming-item .t{font-weight:800; font-size:.9rem; color:var(--teal-900);}
  .upcoming-item .time{display:flex; align-items:center; font-size:.78rem; color:var(--teal-600); font-weight:700; margin-top:4px;}

  .cta{
    display:flex; align-items:center; justify-content:center; text-align:center; margin-top:34px; padding:16px;
    border-radius:999px; background:linear-gradient(120deg, var(--gold-500), var(--sakura-400));
    color:#fff; font-weight:800; font-size:.95rem; letter-spacing:.03em;
    box-shadow:0 10px 28px rgba(226,180,99,.45);
  }
  .cta .icon{margin-right:.5em; margin-left:0;}

  footer{
    margin-top:44px; padding-top:18px; text-align:center;
    font-size:.76rem; color:var(--teal-700); opacity:.75;
    border-top:1px solid rgba(4,82,74,.12);
  }
</style>
</head>
<body>

<header>
  <div class="corner-logo">櫻桃ビジネススクール<span>SATELLITE CAMPUS NIIGATA</span></div>
  <h1><span class="konkai">魂海ーKONKAIー</span><span class="page-sub">セミナースケジュール</span></h1>
</header>
<div class="ocean-waves" aria-hidden="true">
  <svg class="wave wave-a" viewBox="0 0 2400 130" preserveAspectRatio="none"><path d="M0,50 C150,20 450,80 600,50 C750,20 1050,80 1200,50 C1350,20 1650,80 1800,50 C1950,20 2250,80 2400,50 L2400,130 L0,130 Z"/></svg>
  <svg class="wave wave-b" viewBox="0 0 2400 130" preserveAspectRatio="none"><path d="M0,72 C150,110 450,32 600,72 C750,110 1050,32 1200,72 C1350,110 1650,32 1800,72 C1950,110 2250,32 2400,72 L2400,130 L0,130 Z"/></svg>
  <svg class="wave wave-c" viewBox="0 0 2400 130" preserveAspectRatio="none"><path d="M0,96 C150,64 450,120 600,96 C750,64 1050,120 1200,96 C1350,64 1650,120 1800,96 C1950,64 2250,120 2400,96 L2400,130 L0,130 Z"/></svg>
</div>

<div class="wrap">
  <p class="section-label">次回のセミナー</p>
  <div id="next-slot"></div>

  <p class="section-label">今後の予定</p>
  <div id="upcoming-list" class="upcoming-list"></div>

  <a class="cta" href="https://lin.ee/St2QIVZ" target="_blank" rel="noopener">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-11.78 7.84L4 21l1.66-5.22A8.5 8.5 0 1 1 21 11.5Z"/></svg>
    公式LINEで相談・お申し込み
  </a>
</div>

<footer>&copy; 櫻桃ビジネススクール サテライトキャンパス新潟校</footer>

<script>
  /*
   * ここにセミナー予定を追加してください。
   * 過去の日時は自動的に一覧から消えます（削除不要）。
   * date: "YYYY-MM-DD", time: "開始-終了" の文字列, title: セミナー名, desc: 内容説明
   */
  const seminars = [
    { date: "2026-08-11", time: "18:00-19:20", title: "「言葉を変えると経済的階層が変わる①」", desc: "講師：佐川朋子" },
    { date: "2026-08-13", time: "20:00-21:20", title: "「言葉を変えると経済的階層が変わる②」", desc: "講師：佐川朋子" },
    { date: "2026-08-15", time: "10:00-11:20", title: "「自己肯定感と潜在意識②」", desc: "講師：佐川朋子" },
    { date: "2026-08-18", time: "18:00-19:20", title: "「成功する人の思考パターン①」", desc: "講師：佐川朋子" },
    { date: "2026-08-20", time: "20:00-21:20", title: "「成功する人の思考パターン②」", desc: "講師：佐川朋子" },
    { date: "2026-08-22", time: "10:00-11:20", title: "「あなたのなかにいる『不幸になりたい自分』を壊す」", desc: "講師：佐川朋子" },
    { date: "2026-08-25", time: "18:00-19:20", title: "「最高のパフォーマンスを出す潜在意識の使い方①」", desc: "講師：佐川朋子" },
    { date: "2026-08-27", time: "20:00-21:20", title: "「最高のパフォーマンスを出す潜在意識の使い方②」", desc: "講師：佐川朋子" },
    { date: "2026-08-29", time: "10:00-11:20", title: "「過去のトラウマでビジネスを成功させる」", desc: "講師：佐川朋子" }
  ];

  const weekdays = ["日","月","火","水","木","金","土"];
  const ICO_CLOCK = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>';
  const ICO_USER = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.5-4 5-6 7.5-6s6 2 7.5 6"/></svg>';

  function parseStart(s) {
    const startTime = (s.time || "").split("-")[0].trim();
    return new Date(`${s.date}T${startTime || "00:00"}:00`);
  }

  function fmtDate(dateStr) {
    const d = new Date(`${dateStr}T00:00:00`);
    return { md: `${d.getMonth() + 1}/${d.getDate()}`, wd: weekdays[d.getDay()] + "曜" };
  }

  const now = new Date();
  const upcoming = seminars
    .filter(s => parseStart(s) >= now)
    .sort((a, b) => parseStart(a) - parseStart(b));

  const nextSlot = document.getElementById("next-slot");
  const listEl = document.getElementById("upcoming-list");

  if (upcoming.length === 0) {
    nextSlot.innerHTML = `<div class="empty-note">現在、開催予定のセミナーはありません。<br>公式LINEよりお問い合わせください。</div>`;
  } else {
    const next = upcoming[0];
    const { md, wd } = fmtDate(next.date);
    nextSlot.innerHTML = `
      <div class="next-card">
        <div class="next-date"><span class="yw">${wd}</span>${md}</div>
        <div class="next-time">${ICO_CLOCK}${next.time}</div>
        <div class="next-title">${next.title}</div>
        ${next.desc ? `<div class="next-desc">${ICO_USER}${next.desc}</div>` : ""}
      </div>`;

    const rest = upcoming.slice(1);
    listEl.innerHTML = rest.length
      ? rest.map(s => {
          const f = fmtDate(s.date);
          return `<div class="upcoming-item">
            <div class="d">${f.md}<span>${f.wd}</span></div>
            <div class="body">
              <div class="t">${s.title}</div>
              <div class="time">${ICO_CLOCK}${s.time}</div>
            </div>
          </div>`;
        }).join("")
      : `<p style="font-size:.85rem; color:var(--teal-700); opacity:.75;">現在のところ、これ以降の予定はまだありません。</p>`;
  }
</script>

</body>
</html>
