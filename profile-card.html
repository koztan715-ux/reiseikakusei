<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自己紹介 ― 佐川 朋子 | 魂核 KONKAKU</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap');

  :root{
    --space-950:#050a16;
    --space-900:#081127;
    --space-800:#0c1c3a;
    --ocean-700:#0f3a5f;
    --ocean-600:#134f7e;
    --ocean-500:#1c6c9c;
    --ocean-300:#5fa8cf;
    --mist-100:#eaf3fb;
    --mist-050:#f6fafd;
    --sakura-100:#fff1f6;
    --sakura-200:#ffdce8;
    --sakura-300:#ffc0d6;
    --sakura-400:#ff9fc0;
    --gold-soft:#e8cf9a;
    --ink:#0a1424;
    --serif: "Shippori Mincho", "Cormorant Garamond", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    font-family:var(--sans);
    background:radial-gradient(120% 120% at 50% 0%, var(--space-800) 0%, var(--space-950) 65%);
    color:var(--ink);
  }

  .card{
    width:100%;
    max-width:760px;
    background:#fff;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 40px 90px rgba(5,10,22,.55);
    display:flex;
    flex-wrap:wrap;
  }

  .card-photo{
    flex:1 1 260px;
    min-height:320px;
    background:linear-gradient(160deg, var(--ocean-700), var(--space-900));
    position:relative;
  }
  .card-photo img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .card-photo::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(0deg, rgba(5,10,22,.35), transparent 40%);
  }

  .card-body{
    flex:1.4 1 340px;
    padding:48px 42px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .tag{
    display:inline-block;
    font-family:var(--serif);
    font-size:.72rem;
    letter-spacing:.22em;
    color:var(--ocean-500);
    background:var(--mist-050);
    border:1px solid var(--mist-100);
    padding:6px 14px;
    border-radius:999px;
    width:fit-content;
  }

  .name{
    margin-top:1.1rem;
    font-family:var(--serif);
    font-weight:700;
    letter-spacing:.04em;
    font-size:clamp(1.5rem, 3vw, 1.9rem);
    display:flex;
    align-items:baseline;
    gap:.7rem;
    flex-wrap:wrap;
  }
  .name-en{
    font-family:var(--sans);
    font-size:.82rem;
    letter-spacing:.14em;
    color:#7a8aa0;
    font-weight:400;
  }

  .role{
    margin-top:.5rem;
    font-family:var(--serif);
    font-size:.9rem;
    letter-spacing:.1em;
    color:var(--ocean-600);
  }

  .bio{
    margin-top:1.4rem;
    font-size:.92rem;
    line-height:2;
    color:#3c4b60;
  }

  .divider{
    margin:1.6rem 0;
    height:1px;
    background:linear-gradient(90deg, var(--gold-soft), transparent);
  }

  .contact{
    display:flex;
    gap:1.6rem;
    flex-wrap:wrap;
    font-size:.82rem;
    color:#5a6a80;
  }
  .contact span{ font-family:var(--serif); letter-spacing:.08em; color:var(--ink); margin-right:.4em; }

  @media (max-width:640px){
    .card{ border-radius:16px; }
    .card-photo{ min-height:260px; }
    .card-body{ padding:36px 28px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="card-photo">
      <img src="instructor-sagawa-tomoko.png" alt="佐川 朋子">
    </div>
    <div class="card-body">
      <span class="tag">INSTRUCTOR ― 魂核 KONKAKU</span>
      <h1 class="name">佐川 朋子<span class="name-en">Tomoko Sagawa</span></h1>
      <p class="role">霊性覚醒 -REISEI KAKUSEI- 主宰 / 日本画家</p>

      <p class="bio">
        生まれながらの霊能力を活かし、これまでに多くの願望実現を叶える。<br>
        10代より日本画家として活動し、全国規模の美術展へ出品多数。<br>
        2014年には京都御所南にて画廊を開業し、国際的なアートコレクターやアーティストたちと交流を重ねる。<br>
        現在は元麻布を拠点にし、世界のスピリチュアルスポットを訪問中。
      </p>

      <div class="divider"></div>

      <div class="contact">
        <div><span>拠点</span>東京・元麻布</div>
        <div><span>活動</span>個別指導 / セミナー / 全国オフ会</div>
      </div>
    </div>
  </div>

</body>
</html>
